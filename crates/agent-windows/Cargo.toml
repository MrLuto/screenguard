[package]
name = "agent-windows"
version = "0.10.9"
edition = "2024"

[[bin]]
name = "screenguard-agent-windows"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core" }
common = { path = "../common" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Networking_WinInet", "Win32_System_Rpc", "Win32_System_WindowsProgramming"] }
iana-time-zone = "0.1"
toml = "0.8"
rand = "0.8"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
