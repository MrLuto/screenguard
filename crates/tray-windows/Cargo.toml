[package]
name = "tray-windows"
version = "0.10.9"
edition = "2024"
[[bin]]
name = "screenguard-tray-windows"
path = "src/main.rs"
[dependencies]
agent-core = { path = "../agent-core" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Shutdown", "Win32_System_Services", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Networking_WinInet"] }
